name: Secret detection

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-detection-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (complete history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 --wrap=0)"
          readonly auth_header
          git -c "http.https://github.com/.extraheader=${auth_header}" fetch \
            --no-tags --prune origin "+${GITHUB_SHA}:refs/remotes/origin/scan"
          git checkout --detach refs/remotes/origin/scan

      - name: Install pinned Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          readonly version="8.28.0"
          readonly archive="gitleaks_${version}_linux_x64.tar.gz"
          readonly expected_sha256="a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan complete repository history
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" git --redact=100 --no-banner --verbose .
