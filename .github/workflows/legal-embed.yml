name: Legal Skills Embed

on:
  push:
    branches: [main]
    # skills/** (not skills/legal/**): GitHub evaluates paths filters against only the
    # first 300 changed files of a push. The CD-959 rollout (2,093 files) sorted
    # skills/capital/** into the first 300, so every other domain's embed silently
    # never triggered (CD-1315). skill-embed.yml diffs per-domain, so off-domain pushes no-op.
    paths:
      - 'skills/**'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Embed ALL legal skills (not just changed). Safe: only touches domain=legal rows.'
        required: false
        type: boolean
        default: false

jobs:
  embed:
    uses: ./.github/workflows/skill-embed.yml
    with:
      vertical: legal
      domain: legal
      full_sync: ${{ inputs.full_sync == true }}
    secrets:
      SKILLS_DB_URL: ${{ secrets.SKILLS_DB_URL }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
